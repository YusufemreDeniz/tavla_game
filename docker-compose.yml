services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD zorunludur (.env dosyasina yazin)}"
      MSSQL_PID: "Express"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Port mapping yalnizca gelistirme icindir; production'da kaldirin.
    ports:
      - "127.0.0.1:14333:1433"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=KizTavlasiOnline;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY zorunludur (.env dosyasina yazin)}"
      Jwt__Issuer: "KizTavlasiOnline"
      Jwt__Audience: "KizTavlasiOnline"
      Jwt__ExpirationHours: "24"
      Game__RoomExpirationHours: "24"
      Game__DisconnectedPlayerGraceMinutes: "5"
      Game__CleanupIntervalMinutes: "10"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mssql-data:
